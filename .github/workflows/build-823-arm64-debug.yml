name: Build 823 arm64 debug APK

on:
  push:
    branches:
      - build/823-arm64-debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - run: flutter pub get
      - name: Build arm64 debug APK
        run: flutter build apk -t lib/src/main.dart --debug --target-platform android-arm64
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk JHenTai-823-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JHenTai-823-arm64-debug
          path: JHenTai-823-arm64-debug.apk
          if-no-files-found: error
